version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
      testes:
        patterns:
          - "xunit*"
          - "coverlet*"
    ignore:
      # Atualizações de major (ex.: .NET 10 -> 11) exigem decisão explícita.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
